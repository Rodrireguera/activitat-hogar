@if (carregant()) {
  <div class="spinner-container">
    <div class="spinner"></div>
    <p>Carregant...</p>
  </div>
}

@else if (error()) {
  <div class="error">
    <p class="errortext">{{ error() }}</p>
    <button (click)="reintentar()">Tornar a intentar</button>
  </div>
}

@else {
  <div class="grid">
    @for (element of elements(); track element.id) {
      <div class="card">
        <h3>{{ element.titol }}</h3>
        <p class="descripcio">{{ element.descripcio }}</p>
        <p>Preu: <strong>{{ element.preu }} €</strong></p>
      </div>
    }
  </div>
}
