<div>
    <h2>Llista d'insdustrials</h2>
    <ul *ngIf="hiHaElements; else senseResultats">
        <li *ngFor="let element of elements; let i = index; trackBy: trackById" >
            <app-targeta-element 
                [element]="element" 
                (clic)="onSeleccionar($event)">
            </app-targeta-element>
        </li>
    </ul>
    <ng-template #senseResultats>
        <p class="notrobats">No s'han trobat elements.</p>
    </ng-template>
</div>
