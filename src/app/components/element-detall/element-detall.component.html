
<div *ngIf="element() as el; else loading" class="element-detall">
  <p><strong>ID:</strong> {{ el.id }}</p>
  <p><strong>Nom:</strong> {{ el.titol }}</p>
  <p><strong>Descripció:</strong> {{ el.descripcio }}</p>
  <p><strong>Preu:</strong> {{ el.preu }}</p>
</div>

<ng-template #loading>
  <p>Carregant...</p>
</ng-template>
